name: Build and Analyze Frontend

on:
  push:
    branches:
      - test
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Notificar resultado al equipo
        if: always() # Se ejecuta siempre al terminar, falle o pase
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.CORREO_GMAIL }}
          password: ${{ secrets.CLAVE_GMAIL }}
          subject: ${{ job.status == 'success' && '✅ Código Aceptado - Pipeline Exitoso (Frontend)' || '❌ Código Rechazado - Falló el Quality Gate (Frontend)' }}
          to: tu_equipo@correo.com # Cambia por el correo de destino o de tu equipo
          from: Automatización Códice
          body: |
            El último Pull Request del Frontend ha finalizado con estado: ${{ job.status }}.
            
            Para revisar los errores detallados:
            - Ver logs de la ejecución en GitHub: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Revisar issues y líneas exactas en SonarCloud: https://sonarcloud.io/project/issues?id=${{ github.event.repository.name }}
